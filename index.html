<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四川现货电价看板</title><style>
:root{--ink:#1c1c1e;--sub:#5b6068;--line:#e4e6ea;--bg:#f6f7f9;--red:#c0392b;--blue:#1f6fb2;--green:#1e8e5a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:30px 24px 64px}
h1{font-size:27px;margin:0 0 22px}
h2{font-size:20px;margin:36px 0 12px;padding-left:12px;border-left:4px solid var(--red);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.ctl{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--sub);margin:0 0 10px}
.ctl select{max-width:320px}
select{font:14px/1.5 inherit;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:13.5px/1.5 inherit;padding:5px 14px;border:0;background:#fff;color:var(--sub);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--red);color:#fff}
.chartbox{position:relative}
svg{display:block}
#tip{position:absolute;pointer-events:none;display:none;background:rgba(28,28,30,.93);color:#fff;
     font-size:12.5px;line-height:1.6;padding:8px 11px;border-radius:7px;white-space:nowrap;z-index:5}
#tip b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px;font-size:13px;justify-content:center}
.lg{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border:1px solid var(--line);
    border-radius:20px;background:#fff;cursor:pointer;user-select:none;color:#a3a9b1;transition:.12s}
.lg i{width:10px;height:10px;border-radius:2px;background:#c9ced5;display:inline-block}
.lg.on{color:var(--ink);border-color:#c6ccd3;background:#fff}
.lg.on i{background:var(--c,#c9ced5)}
.lg:hover{border-color:#aab2bb}
.tblwrap{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;font-size:13.5px;white-space:nowrap;width:100%}
table th,table td{border:1px solid var(--line);padding:7px 12px;text-align:right;font-variant-numeric:tabular-nums}
table th{background:#eef1f5;font-weight:600;text-align:center;color:#41474f}
table td:first-child{text-align:left}
table .dr{position:sticky;left:0;z-index:2;background:#fafbfc;text-align:left;font-weight:600;min-width:112px}
table thead .dr{background:#eef1f5;z-index:3}
table tbody tr:nth-child(even) td{background:#fcfcfd}
table tbody tr:nth-child(even) td.dr{background:#f6f8f9}
table tbody tr:hover td{background:#f3f6f9}
table tbody tr:hover td.dr{background:#eef2f6}
table.st{font-size:11px}
table.st th,table.st td{padding:3px 4px}
table.st .dr{min-width:84px;font-size:11.5px}
td.sum{background:#fdf6f5}
table tbody tr:nth-child(even) td.sum{background:#fbf1ef}
td.na{color:#c9ced5}
td.sig-hi{background:#f0b3ac;color:#7f1d13;font-weight:600}
td.sig-hi2{background:#fbdedb}
td.sig-lo{background:#a6d3b1;color:#155c2c;font-weight:600}
td.sig-lo2{background:#e1f0e5}
table tbody tr:nth-child(even) td.sig-hi{background:#ecaaa2}
table tbody tr:nth-child(even) td.sig-hi2{background:#f9d8d5}
table tbody tr:nth-child(even) td.sig-lo{background:#9dcdab}
table tbody tr:nth-child(even) td.sig-lo2{background:#dcEEE0}
.foot{font-size:12px;color:#8a9099;margin-top:14px}
</style></head><body><div class="wrap">
<h1>四川电力现货电价看板</h1>
<h2>现货电价与各电源出清电量</h2>
<div class="ctl"><span>日期：<select id="scope"></select></span><span>粒度：<span class="seg" id="gran"><button data-g="h" class="on">小时</button><button data-g="m15">15 分钟</button></span></span><span id="hint" style="color:#8a9099"></span></div>
<div class="legend" id="legend"></div>
<div class="card chartbox"><div id="chart"></div><div id="tip"></div></div>
<h2>逐日价格箱体图</h2>
<div class="ctl"><span>范围：<select id="boxrange"></select></span><span id="boxhint" style="color:#8a9099"></span></div>
<div class="card"><div id="boxchart"></div></div>
<h2>系统备用信息</h2>
<div class="ctl"><span>范围：<select id="resvrange"></select></span><span>时段：<select id="resvslot"><option value="00:00-03:00">00:00-03:00</option><option value="03:00-06:00">03:00-06:00</option><option value="06:00-10:00">06:00-10:00</option><option value="10:00-14:00">10:00-14:00</option><option value="14:00-17:00">14:00-17:00</option><option value="17:00-22:00">17:00-22:00</option><option value="22:00-24:00">22:00-24:00</option><option value="整日平均" selected>整日平均</option></select></span><span id="resvhint" style="color:#8a9099"></span></div>
<div class="legend" id="resvlegend"></div>
<div class="card"><div id="resvchart"></div></div>
<div class="card" style="padding:0"><div class="tblwrap"><table id="resvtable"></table></div></div>
<h2>价格统计</h2>
<div class="ctl"><span>月份：<select id="statmonth"></select></span><span>着色：<select id="sigk"><option value="1">±1σ</option><option value="1.5" selected>±1.5σ</option><option value="2">±2σ</option></select></span><span>行为逐小时均价（该小时 4 个 15 分钟点按<b>出清电量加权</b>）；<b>近 5 天均价固定取最近 5 个完整日</b>，不随月份变化；24 点价格按该行<b>均值 ± 倍数标准差</b>着色（红=偏高、绿=偏低）。</span></div>
<div class="card" style="padding:0"><div class="tblwrap"><table id="stattable" class="st"></table></div></div>
<div class="foot">数据源：新一代电力交易平台 10118 实时出清电价（元/MWh）、10120 日内各电源类型出清电量（MW）、10140 系统备用信息（MW）；数据范围 2025-10-01 ~ 2026-10-04，取数时点 2026-10-05 11:30:28。</div>
</div>

<script>
var SPLIT=true;
var ALL=SPLIT?null:JSON.parse(document.getElementById("DATA").textContent);

var VW=1264, PL=72, PR=72, PT=34, PB=52, H=410;
var VH=PT+H+PB;
var Q_LO=0, Q_FIX=50000, E_LO_FIX=-50, E_HI_FIX=450;
var SERIES=[["水电","#5b9bd5"],["火电","#ed7d31"],["风电","#a9d18e"],["光伏","#ffd966"],["储能","#b4a7d6"]];
var C_PRICE="#d62728", C_BID="#1a1a1a";
var DURL='data/';
/* 全局数据视图：站点模式下按月增量并入，单文件模式下一次到位 */
var FULL=[],PART=[],PRICE={},QTY={},STAT={},BOX={},RES={},MON={},MAN=null;
var TODAY=null, LASTFULL=null;
var state={scope:null, gran:'h', sel:{}};
SERIES.forEach(function(s){ state.sel[s[0]]=true; });
state.sel["竞价空间"]=true; state.sel["现货电价"]=true;

function p2(n){n=Math.floor(n);return (n<10?'0':'')+n;}
function mmdd(d){return d.slice(5);}
function agg4(a){var o=[],i,j,s,c;for(i=0;i<a.length;i+=4){s=0;c=0;for(j=i;j<Math.min(i+4,a.length);j++){s+=a[j];c++;}o.push(c?s/c:null);}return o;}
function hourlyW(p,q){
  var o=[],i,j,s,c;
  for(i=0;i<p.length;i+=4){
    s=0;c=0;
    for(j=i;j<Math.min(i+4,p.length);j++){ var qq=(q&&j<q.length&&q[j]!=null)?q[j]:1; s+=qq*p[j]; c+=qq; }
    o.push(c?s/c:null);
  }
  return o;
}
function seqOf(name,rec,gran){var a=(rec&&rec[name])||[];if(!a.length)return [];return gran==='h'?agg4(a):a.slice();}
function labelFor(i){if(state.gran==='h')return state.scope+' '+p2(i)+':00–'+p2(i+1)+':00';return state.scope+' '+p2(Math.floor(i/4))+':'+p2((i%4)*15);}

/* ================= ① 电价 + 各电源出清电量 ================= */
function draw(){
  var p=PRICE[state.scope]||[], rec=QTY[state.scope]||{}, tot=rec["总出清电量"]||[];
  var price = state.gran==='h' ? hourlyW(p,tot) : p.slice();
  var NS = state.gran==='h' ? 24 : 96;          /* 固定槽位：当天未出完右侧留空 */
  var n = Math.min(NS, price.length);
  var i, k, g, t;
  var iw=VW-PL-PR;
  var X=function(i2){return PL+iw*(i2+0.5)/NS;};

  var qs={};
  SERIES.forEach(function(s){ qs[s[0]]=seqOf(s[0],rec,state.gran); });

  /* 竞价空间 = 火电 + 水电 - 当天火电最低 */
  var hy=qs["水电"]||[], th=qs["火电"]||[], mn=Infinity;
  for(i=0;i<n;i++){ if(th[i]!=null && th[i]<mn) mn=th[i]; }
  if(!isFinite(mn)) mn=0;
  var bid=[];
  for(i=0;i<n;i++) bid.push((hy[i]||0)+(th[i]||0)-mn);

  var qmax=0;
  for(i=0;i<n;i++){ if(tot[i]>qmax) qmax=tot[i]; }
  var qhi=Math.max(Q_FIX, Math.ceil(qmax/10000)*10000);
  var Yq=function(v){return PT+H-H*(v-Q_LO)/(qhi-Q_LO);};

  var emin=Infinity, emax=-Infinity;
  for(i=0;i<n;i++){ if(price[i]!=null){ if(price[i]<emin)emin=price[i]; if(price[i]>emax)emax=price[i]; } }
  if(!isFinite(emin)){emin=0;emax=1;}
  var elo=Math.min(E_LO_FIX, Math.floor(emin/50)*50);
  var ehi=Math.max(E_HI_FIX, Math.ceil(emax/50)*50);
  var Yp=function(v){return PT+H-H*(v-elo)/(ehi-elo);};

  var s=[], y, v2;
  for(g=0;g<=5;g++){
    y=PT+H-H*g/5;
    s.push('<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(PL+iw)+'" y2="'+y.toFixed(1)+'" stroke="#eaecf0"/>');
    s.push('<text x="'+(PL-8)+'" y="'+(y+4).toFixed(1)+'" font-size="11" fill="#6b7280" text-anchor="end">'+Math.round((qhi-Q_LO)*g/5/1000)*1000+'</text>');
    v2=elo+(ehi-elo)*g/5;
    s.push('<text x="'+(PL+iw+8)+'" y="'+(y+4).toFixed(1)+'" font-size="11" fill="'+C_PRICE+'" text-anchor="start">'+Math.round(v2)+'</text>');
  }
  var step=state.gran==='h'?1:4;
  for(t=0;t<NS;t+=step){
    if(t<n) s.push('<line x1="'+X(t).toFixed(1)+'" y1="'+PT+'" x2="'+X(t).toFixed(1)+'" y2="'+(PT+H)+'" stroke="#f4f6f8"/>');
  }
  /* 未出完区域的提示底纹 */
  if(n<NS){
    s.push('<rect x="'+X(n).toFixed(1)+'" y="'+PT+'" width="'+(PL+iw-X(n)).toFixed(1)+'" height="'+H+'" fill="#fafbfc"/>');
    s.push('<text x="'+((X(n)+PL+iw)/2).toFixed(1)+'" y="'+(PT+H/2)+'" font-size="12" fill="#c3c8cf" text-anchor="middle">数据未出</text>');
  }

  var bw=Math.max(1.5, iw/NS*0.72), cum=new Array(n).fill(0);
  for(k=0;k<SERIES.length;k++){
    var nm=SERIES[k][0], col=SERIES[k][1], arr=qs[nm]||[];
    if(!state.sel[nm]) continue;
    var top=new Array(n);
    for(i=0;i<n;i++) top[i]=cum[i]+(arr[i]||0);
    for(i=0;i<n;i++){
      var y0=Yq(cum[i]), y1=Yq(top[i]), hh=Math.abs(y0-y1);
      if(hh<0.3) continue;
      s.push('<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+Math.min(y0,y1).toFixed(1)+
             '" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+col+'" opacity="0.85"/>');
    }
    cum=top;
  }
  if(state.sel["竞价空间"]){
    var bp=[];
    for(i=0;i<n;i++) bp.push(X(i).toFixed(1)+','+Yq(bid[i]).toFixed(1));
    s.push('<polyline points="'+bp.join(' ')+'" fill="none" stroke="'+C_BID+'" stroke-width="1.7"/>');
  }
  if(state.sel["现货电价"]){
    var pp=[];
    for(i=0;i<n;i++){ if(price[i]==null) continue; pp.push(X(i).toFixed(1)+','+Yp(price[i]).toFixed(1)); }
    s.push('<polyline points="'+pp.join(' ')+'" fill="none" stroke="'+C_PRICE+'" stroke-width="1.7"/>');
  }
  for(t=0;t<NS;t+=step){
    var hh2=state.gran==='h'?t:t/4;
    s.push('<text x="'+X(t).toFixed(1)+'" y="'+(PT+H+18)+'" font-size="10.5" fill="#555" text-anchor="middle">'+p2(hh2)+':00</text>');
  }
  s.push('<text x="'+PL+'" y="'+(PT-12)+'" font-size="12.5" fill="#6b7280">出清电量（MW）· 堆叠柱</text>');
  s.push('<text x="'+(PL+iw)+'" y="'+(PT-12)+'" font-size="12.5" fill="'+C_PRICE+'" text-anchor="end">出清电价（元/MWh）· 折线</text>');
  s.push('<line id="gl" x1="0" y1="'+PT+'" x2="0" y2="'+(PT+H)+'" stroke="#1f6fb2" stroke-width="1.1" opacity="0"/>');
  s.push('<circle id="gd" cx="0" cy="0" r="4" fill="'+C_PRICE+'" opacity="0"/>');
  s.push('<circle id="gb" cx="0" cy="0" r="3.4" fill="'+C_BID+'" opacity="0"/>');

  document.getElementById('chart').innerHTML='<svg viewBox="0 0 '+VW+' '+VH+'" width="100%" role="img">'+s.join('')+'</svg>';

  var svg=document.querySelector('#chart svg');
  svg.addEventListener('mousemove',function(e){
    var r=svg.getBoundingClientRect();
    var sx=(e.clientX-r.left)/r.width*VW;
    var idx=Math.floor((sx-PL)/(iw/NS));
    if(idx<0)idx=0; if(idx>n-1)idx=n-1;
    if(price[idx]==null && !(qs["水电"]||[])[idx]) return;
    var gx=X(idx);
    var gl=document.getElementById('gl'), gd=document.getElementById('gd'), gb=document.getElementById('gb');
    gl.setAttribute('x1',gx.toFixed(1)); gl.setAttribute('x2',gx.toFixed(1)); gl.setAttribute('opacity','0.5');
    if(price[idx]!=null){
      gd.setAttribute('cx',gx.toFixed(1)); gd.setAttribute('cy',Yp(price[idx]).toFixed(1)); gd.setAttribute('opacity','1');
    } else gd.setAttribute('opacity','0');
    if(bid[idx]!=null){ gb.setAttribute('cx',gx.toFixed(1)); gb.setAttribute('cy',Yq(bid[idx]).toFixed(1)); gb.setAttribute('opacity','1'); }
    else gb.setAttribute('opacity','0');
    var box=document.querySelector('.chartbox').getBoundingClientRect();
    var tip=document.getElementById('tip'), rows='';
    SERIES.forEach(function(sr){
      var arr=qs[sr[0]]||[], v=arr[idx];
      rows+='<br><span style="color:'+sr[1]+'">■</span> '+sr[0]+' <b>'+(v!=null?Math.round(v).toLocaleString():'—')+'</b>';
    });
    rows+='<br><span style="color:'+C_BID+'">—</span> 竞价空间 <b>'+(bid[idx]!=null?Math.round(bid[idx]).toLocaleString():'—')+'</b>';
    tip.innerHTML='<b>'+labelFor(idx)+'</b><br>出清电价 <b style="color:#ffb3a7">'+
      (price[idx]!=null?price[idx].toFixed(2):'—')+'</b> 元/MWh<br>总出清电量 <b>'+
      (tot[idx]!=null?Math.round(tot[idx]).toLocaleString():'—')+'</b> MW'+rows;
    tip.style.display='block';
    var tx=e.clientX-box.left+14, ty=e.clientY-box.top-42;
    if(tx>box.width-240) tx=box.width-240;
    if(ty<0) ty=6;
    tip.style.left=tx+'px'; tip.style.top=ty+'px';
  });
  svg.addEventListener('mouseleave',function(){
    document.getElementById('tip').style.display='none';
    document.getElementById('gl').setAttribute('opacity','0');
    document.getElementById('gd').setAttribute('opacity','0');
    document.getElementById('gb').setAttribute('opacity','0');
  });
  document.getElementById('hint').textContent='共 '+n+' 个点'+(n<NS?'（当天未出完，右侧留空）':'');
}

/* 可勾选图例 */
function buildLegend(){
  var items=SERIES.map(function(s){return [s[0],s[1]];});
  items.push(["竞价空间",C_BID]);
  items.push(["现货电价",C_PRICE]);
  var h='';
  for(var i=0;i<items.length;i++){
    h+='<span class="lg on" data-k="'+items[i][0]+'" style="--c:'+items[i][1]+'"><i></i>'+items[i][0]+'</span>';
  }
  var el=document.getElementById('legend');
  el.innerHTML=h;
  var bs=el.querySelectorAll('.lg');
  for(var q=0;q<bs.length;q++){
    bs[q].addEventListener('click',function(){
      var k=this.getAttribute('data-k');
      state.sel[k]=!state.sel[k];
      this.className=state.sel[k]?'lg on':'lg';
      draw();
    });
  }
}

/* ================= ② 箱体图（可筛选） ================= */
function rangeDays(kind){
  if(kind.indexOf('m:')===0){
    var m=kind.slice(2);
    return FULL.filter(function(d){return d.slice(0,7)===m;});
  }
  var k=parseInt(kind,10);
  return FULL.slice(Math.max(0,FULL.length-k));
}
function boxSVG(days){
  var w=VW, h=340, padL=64, padR=134, padT=22, padB=52;
  var iw=w-padL-padR, ih=h-padT-padB;
  if(!days.length) return '<div style="padding:40px;text-align:center;color:#a3a9b1">无数据</div>';
  var lo=Infinity, hi=-Infinity;
  days.forEach(function(d){ var b=BOX[d]; if(b.lo<lo)lo=b.lo; if(b.hi>hi)hi=b.hi; });
  var span=(hi-lo)||1;
  var Y=function(v){return padT+ih-ih*(v-lo)/span;};
  var o=[], g;
  for(g=0;g<5;g++){
    var y=padT+ih-ih*g/4, val=lo+span*g/4;
    o.push('<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(padL+iw)+'" y2="'+y.toFixed(1)+'" stroke="#e6e6e6"/>');
    o.push('<text x="'+(padL-8)+'" y="'+(y+4).toFixed(1)+'" font-size="11" fill="#7a8089" text-anchor="end">'+val.toFixed(0)+'</text>');
  }
  if(lo<0&&hi>0) o.push('<line x1="'+padL+'" y1="'+Y(0).toFixed(1)+'" x2="'+(padL+iw)+'" y2="'+Y(0).toFixed(1)+'" stroke="#b0b6bf" stroke-width="1.2"/>');
  var step=iw/days.length, bw=Math.min(step*0.5,22);
  days.forEach(function(d,i){
    var b=BOX[d], cx=padL+step*i+step/2;
    o.push('<line x1="'+cx.toFixed(1)+'" y1="'+Y(b.p95).toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+Y(b.p5).toFixed(1)+'" stroke="#9aa2ac" stroke-width="1.1"/>');
    [b.p95,b.p5].forEach(function(v){
      o.push('<line x1="'+(cx-bw*.42).toFixed(1)+'" y1="'+Y(v).toFixed(1)+'" x2="'+(cx+bw*.42).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="#9aa2ac" stroke-width="1.1"/>');
    });
    o.push('<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+Y(b.p75).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(Y(b.p25)-Y(b.p75),1).toFixed(1)+'" fill="#dfe9f5" stroke="#1f6fb2" stroke-width="0.9" rx="2"/>');
    o.push('<line x1="'+(cx-bw/2).toFixed(1)+'" y1="'+Y(b.p50).toFixed(1)+'" x2="'+(cx+bw/2).toFixed(1)+'" y2="'+Y(b.p50).toFixed(1)+'" stroke="#1f6fb2" stroke-width="1.8"/>');
    o.push('<circle cx="'+cx.toFixed(1)+'" cy="'+Y(b.mean).toFixed(1)+'" r="2.6" fill="#c0392b"/>');
  });
  var lab = days.length>40 ? 5 : (days.length>20 ? 3 : 2);
  days.forEach(function(d,i){
    if(i%lab===0 || i===days.length-1)
      o.push('<text x="'+(padL+step*i+step/2).toFixed(1)+'" y="'+(padT+ih+17)+'" font-size="10.5" fill="#555" text-anchor="middle">'+mmdd(d)+'</text>');
  });
  o.push('<text x="'+padL+'" y="'+(padT+ih+38)+'" font-size="11" fill="#8a9099">元/MWh</text>');
  var lx=padL+iw+14;
  [["#dfe9f5","P25–P75"],["#1f6fb2","中位数 P50"],["#9aa2ac","须 P5–P95"],["#c0392b","当日加权均价"]].forEach(function(p,k){
    var ly=padT+4+k*18;
    o.push('<rect x="'+lx+'" y="'+ly+'" width="16" height="10" fill="'+p[0]+'" rx="2"/>');
    o.push('<text x="'+(lx+22)+'" y="'+(ly+9)+'" font-size="11.5" fill="#444">'+p[1]+'</text>');
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img">'+o.join('')+'</svg>';
}
function renderBox(){
  var kind=document.getElementById('boxrange').value;
  var days=rangeDays(kind);
  document.getElementById('boxchart').innerHTML=boxSVG(days);
  document.getElementById('boxhint').textContent=days.length?('共 '+days.length+' 天：'+days[0]+' ~ '+days[days.length-1]):'';
}

/* ================= ③ 系统备用信息 ================= */
var RSER=[["系统备用信息","resv","#5b9bd5"],["总出力","qty","#a5a5a5"]];
var C_RP="#d62728";
state.rsel={}; RSER.forEach(function(s){ state.rsel[s[0]]=true; }); state.rsel["现货价格"]=true;

function resvSVG(days, slot){
  var w=VW, h=360, padL=84, padR=84, padT=28, padB=52;
  var iw=w-padL-padR, ih=h-padT-padB;
  if(!days.length) return '<div style="padding:40px;text-align:center;color:#a3a9b1">无数据</div>';
  var vals=days.map(function(d){ return (RES[d]||{})[slot] || {}; });
  var tmax=0, pmax=0;
  vals.forEach(function(v){
    var tot=0;
    if(state.rsel["系统备用信息"] && v.resv!=null) tot+=v.resv;
    if(state.rsel["总出力"] && v.qty!=null) tot+=v.qty;
    if(!state.rsel["系统备用信息"] && !state.rsel["总出力"] && v.both!=null) tot=v.both;
    if(tot>tmax) tmax=tot;
    if(v.price!=null && v.price>pmax) pmax=v.price;
  });
  var thi=Math.max(10000, Math.ceil(tmax/10000)*10000);
  var phi=Math.max(100, Math.ceil(pmax/100)*100);
  var Yr=function(v){return padT+ih-ih*v/thi;};
  var Yp=function(v){return padT+ih-ih*v/phi;};
  var o=[], g;
  for(g=0;g<=5;g++){
    var y=padT+ih-ih*g/5;
    o.push('<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(padL+iw)+'" y2="'+y.toFixed(1)+'" stroke="#eaecf0"/>');
    o.push('<text x="'+(padL-8)+'" y="'+(y+4).toFixed(1)+'" font-size="11" fill="#6b7280" text-anchor="end">'+Math.round(thi*g/5).toLocaleString()+'</text>');
    o.push('<text x="'+(padL+iw+8)+'" y="'+(y+4).toFixed(1)+'" font-size="11" fill="'+C_RP+'" text-anchor="start">'+Math.round(phi*g/5)+'</text>');
  }
  var step=iw/days.length, bw=Math.min(step*0.62,26);
  days.forEach(function(d,i){
    var v=(RES[d]||{})[slot]||{}, cx=padL+step*i+step/2;
    if(state.rsel["总出力"] && v.qty!=null){
      var base=(state.rsel["系统备用信息"] && v.resv!=null)?v.resv:0;
      var y0=Yr(base), y1=Yr(base+v.qty);
      o.push('<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+Math.min(y0,y1).toFixed(1)+'" width="'+bw.toFixed(1)+
             '" height="'+Math.abs(y0-y1).toFixed(1)+'" fill="#a5a5a5" opacity="0.85"/>');
    }
    if(state.rsel["系统备用信息"] && v.resv!=null){
      var ry=Yr(v.resv);
      o.push('<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+ry.toFixed(1)+'" width="'+bw.toFixed(1)+
             '" height="'+Math.max(padT+ih-ry,0.5).toFixed(1)+'" fill="#5b9bd5" opacity="0.9"/>');
    }
  });
  if(state.rsel["现货价格"]){
    var pp=[];
    days.forEach(function(d,i){
      var v=(RES[d]||{})[slot]||{};
      if(v.price!=null) pp.push((padL+step*i+step/2).toFixed(1)+','+Yp(v.price).toFixed(1));
    });
    if(pp.length) o.push('<polyline points="'+pp.join(' ')+'" fill="none" stroke="'+C_RP+'" stroke-width="1.7"/>');
  }
  var lab = days.length>40 ? 5 : (days.length>20 ? 3 : 2);
  days.forEach(function(d,i){
    if(i%lab===0 || i===days.length-1)
      o.push('<text x="'+(padL+step*i+step/2).toFixed(1)+'" y="'+(padT+ih+17)+'" font-size="10.5" fill="#555" text-anchor="middle">'+mmdd(d)+'</text>');
  });
  o.push('<text x="'+padL+'" y="'+(padT-10)+'" font-size="12.5" fill="#6b7280">电量（MW）· 堆叠柱</text>');
  o.push('<text x="'+(padL+iw)+'" y="'+(padT-10)+'" font-size="12.5" fill="'+C_RP+'" text-anchor="end">现货价格（元/MWh）· 折线</text>');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img">'+o.join('')+'</svg>';
}

function buildResvLegend(){
  var items=RSER.map(function(s){return [s[0],s[2]];});
  items.push(["现货价格",C_RP]);
  var h='';
  for(var i=0;i<items.length;i++)
    h+='<span class="lg on" data-k="'+items[i][0]+'" style="--c:'+items[i][1]+'"><i></i>'+items[i][0]+'</span>';
  var el=document.getElementById('resvlegend');
  el.innerHTML=h;
  var bs=el.querySelectorAll('.lg');
  for(var q=0;q<bs.length;q++){
    bs[q].addEventListener('click',function(){
      var k=this.getAttribute('data-k');
      state.rsel[k]=!state.rsel[k];
      this.className=state.rsel[k]?'lg on':'lg';
      renderResv();
    });
  }
}

function renderResv(){
  var days=rangeDays(document.getElementById('resvrange').value);
  var slot=document.getElementById('resvslot').value;
  document.getElementById('resvchart').innerHTML=resvSVG(days,slot);
  document.getElementById('resvhint').textContent =
    days.length ? ('共 '+days.length+' 天：'+days[0]+' ~ '+days[days.length-1]+'　·　'+slot) : '';
  var cols=[["系统备用信息","resv","MW"],["现货价格","price","元/MWh"],
            ["总出力","qty","MW"],["总出力+系统备用","both","MW"]];
  var h='<thead><tr><th class="dr">日期</th>';
  cols.forEach(function(c){
    h+='<th>'+c[0]+'<br><span style="font-weight:400;color:#8a9099;font-size:11.5px">'+c[2]+'</span></th>';
  });
  h+='</tr></thead><tbody>';
  days.slice().reverse().forEach(function(d){
    var v=(RES[d]||{})[slot]||{};
    h+='<tr><td class="dr">'+d+'</td>';
    cols.forEach(function(c){
      var x=v[c[1]];
      h+='<td>'+(x!=null?(c[1]==='price'?x.toFixed(2):Math.round(x).toLocaleString()):'—')+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody>';
  var tb=document.getElementById('resvtable');
  tb.innerHTML=h;
}

/* ================= ④ 价格统计表（转置） ================= */
function statSigma(){
  var v=parseFloat(document.getElementById('sigk').value);
  return isFinite(v)&&v>0 ? v : 1.5;
}
function cellClass(x, mu, sd, k){
  if(x==null || !(sd>0)) return '';
  var z=(x-mu)/sd;
  if(z>=k) return 'sig-hi';
  if(z>=k/2) return 'sig-hi2';
  if(z<=-k) return 'sig-lo';
  if(z<=-k/2) return 'sig-lo2';
  return '';
}
function rowStats(arr){
  var v=arr.filter(function(x){return x!=null;});
  if(!v.length) return {mu:0, sd:0};
  var mu=v.reduce(function(a,b){return a+b;},0)/v.length;
  var va=v.reduce(function(a,b){return a+(b-mu)*(b-mu);},0)/v.length;
  return {mu:mu, sd:Math.sqrt(va)};
}
function unionRow(days, key){
  var s=STAT[days[0]]||{};
  if(key==='h'){
    var out=[];
    for(var i=0;i<24;i++){
      var vs=[];
      days.forEach(function(d){ var x=(STAT[d]||{h:[]}).h[i]; if(x!=null) vs.push(x); });
      out.push(vs.length?vs.reduce(function(a,b){return a+b;},0)/vs.length:null);
    }
    return out;
  }
  var vs2=[];
  days.forEach(function(d){ var x=(STAT[d]||{})[key]; if(x!=null) vs2.push(x); });
  if(!vs2.length) return null;
  if(key==='hi') return Math.max.apply(null,vs2);
  if(key==='lo') return Math.min.apply(null,vs2);
  return vs2.reduce(function(a,b){return a+b;},0)/vs2.length;
}
function renderStat(){
  var m=document.getElementById('statmonth').value;
  var k=statSigma();
  var days = (m==='ALL') ? FULL.slice() : FULL.filter(function(d){return d.slice(0,7)===m;});
  var partIn = PART.filter(function(d){return m==='ALL' || d.slice(0,7)===m;});
  var recent5 = FULL.slice(-5);          /* 固定：最近 5 个完整日，不随月份变化 */
  var rows=[];
  if(days.length){
    rows.push({name:(m==='ALL'?'全部':(parseInt(m.slice(5),10)+' 月'))+'均价',
               h:unionRow(days,'h'), hi:unionRow(days,'hi'), lo:unionRow(days,'lo'),
               mean:unionRow(days,'mean'), med:unionRow(days,'med'), sum:true});
  }
  rows.push({name:'近 5 天均价', h:unionRow(recent5,'h'), hi:unionRow(recent5,'hi'),
             lo:unionRow(recent5,'lo'), mean:unionRow(recent5,'mean'),
             med:unionRow(recent5,'med'), sum:true,
             sub:recent5[0].slice(5)+' ~ '+recent5[recent5.length-1].slice(5)});
  var ordered = partIn.slice().sort().reverse().concat(days.slice().sort().reverse());
  ordered.forEach(function(d){
    var s=STAT[d];
    rows.push({name:d, h:s.h, hi:s.hi, lo:s.lo,
               mean:s.mean, med:s.med, sum:false});
  });
  var h='<thead><tr><th class="dr">日期</th>';
  for(var i=0;i<24;i++) h+='<th>'+(i)+'-'+(i+1)+'</th>';
  h+='<th>最高价</th><th>最低价</th><th>平均数</th><th>中位数</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var st=rowStats(r.h);
    h+='<tr><td class="dr">'+r.name+(r.sub?'<br><span style="font-weight:400;color:#8a9099;font-size:11.5px">'+r.sub+'</span>':'')+'</td>';
    r.h.forEach(function(x){
      var cls=[]; 
      if(r.sum) cls.push('sum');
      if(x==null) cls.push('na');
      else { var c2=cellClass(x, st.mu, st.sd, k); if(c2) cls.push(c2); }
      h+='<td'+(cls.length?' class="'+cls.join(' ')+'"':'')+'>'+(x==null?'—':x.toFixed(2))+'</td>';
    });
    [["hi",""],["lo",""],["mean",""],["med",""]].forEach(function(kk){
      var x=r[kk[0]], cls=[];
      if(r.sum) cls.push('sum');
      if(x==null) cls.push('na');
      h+='<td'+(cls.length?' class="'+cls.join(' ')+'"':'')+'>'+(x==null?'—':x.toFixed(2))+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody>';
  document.getElementById('stattable').innerHTML=h;
}

/* ================= 按月懒加载（站点模式） ================= */
function monthOf(d){return d.slice(0,7);}
function monthsOf(days){
  var s={}, out=[], i, m;
  for(i=0;i<days.length;i++){ m=monthOf(days[i]); if(!s[m]){ s[m]=1; out.push(m); } }
  return out;
}
function mergeMonth(m){
  var M=MON[m], k;
  if(!M) return;
  for(k in M.PRICE) PRICE[k]=M.PRICE[k];
  for(k in M.QTY) QTY[k]=M.QTY[k];
  for(k in M.STAT) STAT[k]=M.STAT[k];
  for(k in M.BOX) BOX[k]=M.BOX[k];
  for(k in M.RES) RES[k]=M.RES[k];
}
function need(days){
  var ms=monthsOf(days).filter(function(m){return !MON[m];});
  if(!ms.length) return Promise.resolve();
  return Promise.all(ms.map(function(m){
    return fetch(DURL+m+'.json?v='+encodeURIComponent((MAN&&MAN.rev)||''))
      .then(function(r){ if(!r.ok) throw new Error(m+' HTTP '+r.status); return r.json(); })
      .then(function(j){ MON[m]=j; mergeMonth(m); });
  }));
}
function withData(days, fn){
  if(!SPLIT){ fn(); return; }          /* 单文件模式：数据已全在内存 */
  need(days).then(function(){ fn(); }).catch(function(e){
    console.error(e);
    var el=document.getElementById('hint');
    if(el) el.textContent='数据加载失败：'+e.message;
  });
}
function drawSafe(){ withData([state.scope], draw); }
function boxSafe(){ withData(rangeDays(document.getElementById('boxrange').value), renderBox); }
function resvSafe(){ withData(rangeDays(document.getElementById('resvrange').value), renderResv); }
function statDays(){
  var m=document.getElementById('statmonth').value;
  var days=(m==='ALL')?FULL.slice():FULL.filter(function(d){return monthOf(d)===m;});
  var partIn=PART.filter(function(d){return m==='ALL'||monthOf(d)===m;});
  return days.concat(partIn).concat(FULL.slice(-5));
}
function statSafe(){ withData(statDays(), renderStat); }

/* ================= 初始化 ================= */
function initUI(){
  buildLegend();

  /* 日期下拉：今天第一，其余按月分组倒序 */
  var sel=document.getElementById('scope'), o='';
  if(TODAY) o+='<option value="'+TODAY+'">'+TODAY+'（今天 · 进行中）</option>';
  var byM={};
  FULL.slice().reverse().forEach(function(d){ var m=d.slice(0,7); (byM[m]=byM[m]||[]).push(d); });
  Object.keys(byM).sort().reverse().forEach(function(m){
    o+='<optgroup label="'+m+'">';
    byM[m].forEach(function(d){
      o+='<option value="'+d+'">'+d+(d===LASTFULL?'（昨天）':'')+'</option>';
    });
    o+='</optgroup>';
  });
  sel.innerHTML=o;
  /* 默认显示「今天」（当天数据未出完时右侧留空）；没有当天则回落到最近完整日 */
  var def = TODAY || LASTFULL;
  sel.value=def;
  state.scope=def;
  sel.addEventListener('change',function(){ state.scope=this.value; drawSafe(); });
  document.querySelectorAll('#gran button').forEach(function(b){
    b.addEventListener('click',function(){
      state.gran=this.getAttribute('data-g');
      document.querySelectorAll('#gran button').forEach(function(x){ x.className=(x===this)?'on':''; }.bind(this));
      drawSafe();
    });
  });

  /* 范围选择器：箱体图 + 系统备用 */
  var rangeOpts='<option value="10">近 10 天</option><option value="30" selected>近 30 天</option>'+
                '<option value="90">近 90 天</option>'+
                '<optgroup label="按月份">'+
                Object.keys(byM).sort().reverse().map(function(m){
                  return '<option value="m:'+m+'">'+m+'</option>'; }).join('')+
                '</optgroup>';
  ['boxrange','resvrange'].forEach(function(id){
    var e=document.getElementById(id);
    e.innerHTML=rangeOpts;
    e.value=(id==='resvrange')?'10':'30';
    e.addEventListener('change', id==='boxrange'?boxSafe:resvSafe);
  });
  buildResvLegend();
  document.getElementById('resvslot').addEventListener('change',resvSafe);
  document.getElementById('sigk').addEventListener('change',statSafe);

  /* 统计表月份：除有完整日的月份外，也放上「只有未完成日」的当月，
     这样月初第一天就能切到当月、看到当天那一行（否则当月会一直缺席到出现首个完整日）。 */
  var byMS={};
  FULL.concat(PART).forEach(function(d){ byMS[monthOf(d)]=1; });
  var sm=document.getElementById('statmonth');
  var so='<option value="ALL">全部</option>';
  Object.keys(byMS).sort().reverse().forEach(function(m){
    so+='<option value="'+m+'"'+(m===(LASTFULL.slice(0,7))?' selected':'')+'>'+m+'</option>';
  });
  sm.innerHTML=so;
  if(!sm.value) sm.value=LASTFULL.slice(0,7);
  sm.addEventListener('change',statSafe);

  drawSafe();
  boxSafe();
  resvSafe();
  statSafe();
}

function start(){
  LASTFULL = FULL[FULL.length-1];
  /* 只有「比最后一个完整日更新」的未完成日才算「今天」，
     避免历史上有缺口的日期被误认成今天、进而被当默认视图。 */
  var lastPart = PART.length ? PART[PART.length-1] : null;
  TODAY = (lastPart && lastPart > LASTFULL) ? lastPart : null;
  initUI();
}

(function boot(){
  if(!SPLIT){
    MAN=ALL; FULL=ALL.FULL; PART=ALL.PART;
    PRICE=ALL.PRICE; QTY=ALL.QTY; STAT=ALL.STAT; BOX=ALL.BOX; RES=ALL.RES;
    start();
    return;
  }
  fetch(DURL+'manifest.json?_='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('manifest HTTP '+r.status); return r.json(); })
    .then(function(m){
      MAN=m; FULL=m.FULL; PART=m.PART;
      /* 首屏只预载默认视图所需月份（箱体近 30 天 + 近 5 天 + 今日） */
      return need(FULL.slice(-30).concat(FULL.slice(-5)).concat(PART));
    })
    .then(start)
    .catch(function(e){
      console.error(e);
      document.getElementById('hint').textContent='加载失败：'+e.message;
    });
})();

</script>
